<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Teste de Velocidade</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        #resultado { margin-top: 20px; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Medidor de Velocidade Simples</h1>
    <button onclick="testarVelocidade()">Iniciar Teste</button>
    <div id="resultado">Clique no botão para começar.</div>

    <script>
        function testarVelocidade() {
            document.getElementById("resultado").innerText = "Medindo...";
            
            // Link de um arquivo de teste público (exemplo genérico)
            let imageAddr = "https://google.com";
            let downloadSize = 15995; // Tamanho aproximado em bytes
            
            let startTime, endTime;
            let download = new Image();
            
            startTime = (new Date()).getTime();
            
            download.onload = function () {
                endTime = (new Date()).getTime();
                let duration = (endTime - startTime) / 1000;
                let bitsLoaded = downloadSize * 8;
                let speedBps = bitsLoaded / duration;
                let speedKbps = speedBps / 1024;
                let speedMbps = speedKbps / 1024;
                
                document.getElementById("resultado").innerText = 
                    "Velocidade aproximada: " + speedMbps.toFixed(2) + " Mbps";
            };
            
            download.onerror = function () {
                document.getElementById("resultado").innerText = "Erro ao medir a velocidade.";
            };
            
            // Adiciona número aleatório para evitar cache do navegador
            download.src = imageAddr + "?nn=" + startTime;
        }
    </script>

</body>
</html>
