<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jogo da Cobrinha</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        h1 {
            margin-top: 20px;
        }

        canvas {
            background: #181818;
            border: 3px solid white;
            max-width: 95%;
            height: auto;
        }

        #mensagem {
            font-size: 28px;
            margin-top: 15px;
        }

        button {
            margin-top: 10px;
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
            display: none;
        }
    </style>
</head>

<body>

    <h1>🐍 Jogo da Cobrinha</h1>

    <p>Pontos: <span id="pontos">0</span></p>

    <canvas id="jogo" width="1280" height="720"></canvas>

    <div id="mensagem"></div>

    <button id="reiniciar">Tentar novamente</button>

    <script>
        const canvas = document.getElementById("jogo");
        const ctx = canvas.getContext("2d");

        const pontosTexto = document.getElementById("pontos");
        const mensagem = document.getElementById("mensagem");
        const botaoReiniciar = document.getElementById("reiniciar");

        const tamanho = 40;

        let cobra;
        let direcao;
        let proximaDirecao;
        let comida;
        let pontos;
        let gameOver;

        function iniciarJogo() {

            cobra = [
                { x: 600, y: 360 }
            ];

            direcao = "direita";
            proximaDirecao = "direita";

            pontos = 0;

            gameOver = false;

            mensagem.textContent = "";

            botaoReiniciar.style.display = "none";

            pontosTexto.textContent = pontos;

            criarComida();
        }


        function criarComida() {

            let x;
            let y;

            do {

                x = Math.floor(Math.random() * (canvas.width / tamanho)) * tamanho;
                y = Math.floor(Math.random() * (canvas.height / tamanho)) * tamanho;

            } while (
                cobra.some(parte => parte.x === x && parte.y === y)
            );

            comida = { x, y };
        }


        function desenhar() {

            ctx.fillStyle = "#181818";

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            // COMIDA
            ctx.fillStyle = "#e63c3c";

            ctx.beginPath();

            ctx.arc(
                comida.x + tamanho / 2,
                comida.y + tamanho / 2,
                16,
                0,
                Math.PI * 2
            );

            ctx.fill();


            // CORPO
            cobra.forEach((parte, index) => {

                if (index === cobra.length - 1) {
                    ctx.fillStyle = "#00dc50";
                } else {
                    ctx.fillStyle = "#00963c";
                }

                ctx.fillRect(
                    parte.x + 2,
                    parte.y + 2,
                    tamanho - 4,
                    tamanho - 4
                );
            });


            // ROSTO
            const cabeca = cobra[cobra.length - 1];

            desenharRosto(
                cabeca.x,
                cabeca.y
            );
        }


        function desenharRosto(x, y) {

            let olho1;
            let olho2;

            if (direcao === "direita") {

                olho1 = {
                    x: x + 29,
                    y: y + 11
                };

                olho2 = {
                    x: x + 29,
                    y: y + 29
                };

            } else if (direcao === "esquerda") {

                olho1 = {
                    x: x + 11,
                    y: y + 11
                };

                olho2 = {
                    x: x + 11,
                    y: y + 29
                };

            } else if (direcao === "cima") {

                olho1 = {
                    x: x + 11,
                    y: y + 11
                };

                olho2 = {
                    x: x + 29,
                    y: y + 11
                };

            } else {

                olho1 = {
                    x: x + 11,
                    y: y + 29
                };

                olho2 = {
                    x: x + 29,
                    y: y + 29
                };
            }


            ctx.fillStyle = "white";

            ctx.beginPath();

            ctx.arc(
                olho1.x,
                olho1.y,
                7,
                0,
                Math.PI * 2
            );

            ctx.fill();


            ctx.beginPath();

            ctx.arc(
                olho2.x,
                olho2.y,
                7,
                0,
                Math.PI * 2
            );

            ctx.fill();


            ctx.fillStyle = "black";

            ctx.beginPath();

            ctx.arc(
                olho1.x,
                olho1.y,
                4,
                0,
                Math.PI * 2
            );

            ctx.fill();


            ctx.beginPath();

            ctx.arc(
                olho2.x,
                olho2.y,
                4,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }


        function atualizar() {

            if (gameOver) {
                return;
            }

            direcao = proximaDirecao;

            const cabeca = {
                ...cobra[cobra.length - 1]
            };


            if (direcao === "direita") {
                cabeca.x += tamanho;
            }

            if (direcao === "esquerda") {
                cabeca.x -= tamanho;
            }

            if (direcao === "cima") {
                cabeca.y -= tamanho;
            }

            if (direcao === "baixo") {
                cabeca.y += tamanho;
            }


            // BATEU NA PAREDE
            if (
                cabeca.x < 0 ||
                cabeca.x >= canvas.width ||
                cabeca.y < 0 ||
                cabeca.y >= canvas.height
            ) {

                perder();
                return;
            }


            // BATEU NO CORPO
            if (
                cobra.some(
                    parte =>
                        parte.x === cabeca.x &&
                        parte.y === cabeca.y
                )
            ) {

                perder();
                return;
            }


            cobra.push(cabeca);


            // COMEU A COMIDA
            if (
                cabeca.x === comida.x &&
                cabeca.y === comida.y
            ) {

                pontos++;

                pontosTexto.textContent = pontos;

                criarComida();

            } else {

                cobra.shift();
            }


            desenhar();
        }


        function perder() {

            gameOver = true;

            mensagem.textContent = "Você perdeu! Tente novamente.";

            botaoReiniciar.style.display = "inline-block";
        }


        document.addEventListener(
            "keydown",
            function(evento) {

                if (
                    evento.key === "ArrowLeft" &&
                    direcao !== "direita"
                ) {
                    proximaDirecao = "esquerda";
                }

                if (
                    evento.key === "ArrowRight" &&
                    direcao !== "esquerda"
                ) {
                    proximaDirecao = "direita";
                }

                if (
                    evento.key === "ArrowUp" &&
                    direcao !== "baixo"
                ) {
                    proximaDirecao = "cima";
                }

                if (
                    evento.key === "ArrowDown" &&
                    direcao !== "cima"
                ) {
                    proximaDirecao = "baixo";
                }
            }
        );


        botaoReiniciar.addEventListener(
            "click",
            iniciarJogo
        );


        iniciarJogo();

        desenhar();

        setInterval(
            atualizar,
            100
        );
    </script>

</body>
</html>
