<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jogo da Cobrinha</title>

    <style>
        body {
            background: #111;
            color: white;
            text-align: center;
            font-family: Arial;
            margin: 0;
        }

        canvas {
            background: #181818;
            border: 3px solid white;
            width: 90%;
            max-width: 1280px;
        }
    </style>
</head>

<body>

<h1>🐍 Jogo da Cobrinha</h1>

<h2>
    Pontos:
    <span id="pontos">0</span>
</h2>

<canvas
    id="jogo"
    width="1280"
    height="720">
</canvas>

<h2 id="mensagem"></h2>

<script>

const canvas = document.getElementById("jogo");
const ctx = canvas.getContext("2d");

const tamanho = 40;


/* =========================
   VELOCIDADE
========================= */

const velocidade = 150;


/* =========================
   COBRA
========================= */

let cobra = [
    {x: 600, y: 360}
];

let cobraAnterior = [
    {x: 600, y: 360}
];

let direcao = "direita";

let comida = criarComida();

let pontos = 0;

let perdeu = false;

let ultimoMovimento = performance.now();


/* =========================
   COMIDA
========================= */

function criarComida() {

    const x =
        Math.floor(
            Math.random() *
            (1280 / tamanho)
        ) * tamanho;

    const y =
        Math.floor(
            Math.random() *
            (720 / tamanho)
        ) * tamanho;

    return {x, y};
}


/* =========================
   ATUALIZAR JOGO
========================= */

function atualizar() {

    if (perdeu) {
        return;
    }


    cobraAnterior =
        cobra.map(parte => ({
            x: parte.x,
            y: parte.y
        }));


    let cabeca = {

        x:
            cobra[
                cobra.length - 1
            ].x,

        y:
            cobra[
                cobra.length - 1
            ].y

    };


    if (direcao === "direita") {
        cabeca.x += tamanho;
    }

    if (direcao === "esquerda") {
        cabeca.x -= tamanho;
    }

    if (direcao === "cima") {
        cabeca.y -= tamanho;
    }

    if (direcao === "baixo") {
        cabeca.y += tamanho;
    }


    /* PAREDE */

    if (
        cabeca.x < 0 ||
        cabeca.x >= 1280 ||
        cabeca.y < 0 ||
        cabeca.y >= 720
    ) {

        gameOver();

        return;
    }


    /* CORPO */

    for (let parte of cobra) {

        if (
            parte.x === cabeca.x &&
            parte.y === cabeca.y
        ) {

            gameOver();

            return;
        }
    }


    cobra.push(cabeca);


    /* COMIDA */

    if (
        cabeca.x === comida.x &&
        cabeca.y === comida.y
    ) {

        pontos++;

        document.getElementById(
            "pontos"
        ).textContent = pontos;

        comida = criarComida();

    } else {

        cobra.shift();

    }


    /* Ajusta posições anteriores */

    while (
        cobraAnterior.length <
        cobra.length
    ) {

        cobraAnterior.unshift({
            ...cobraAnterior[0]
        });

    }
}


/* =========================
   INTERPOLAÇÃO
========================= */

function interpolar(
    inicio,
    fim,
    progresso
) {

    return inicio +
        (fim - inicio) *
        progresso;
}


/* =========================
   DESENHAR
========================= */

function desenhar(progresso) {

    ctx.fillStyle = "#181818";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* COMIDA */

    ctx.fillStyle = "red";

    ctx.beginPath();

    ctx.arc(
        comida.x + 20,
        comida.y + 20,
        16,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* COBRA */

    cobra.forEach(
        (parte, index) => {

            let anterior =
                cobraAnterior[index]
                || parte;


            let x = interpolar(
                anterior.x,
                parte.x,
                progresso
            );


            let y = interpolar(
                anterior.y,
                parte.y,
                progresso
            );


            if (
                index ===
                cobra.length - 1
            ) {

                ctx.fillStyle =
                    "#00ff66";

            } else {

                ctx.fillStyle =
                    "#00aa44";

            }


            ctx.beginPath();

            ctx.roundRect(
                x + 2,
                y + 2,
                36,
                36,
                8
            );

            ctx.fill();

        }
    );
}


/* =========================
   LOOP 60 FPS
========================= */

function loop(tempo) {

    let passou =
        tempo - ultimoMovimento;


    if (passou >= velocidade) {

        atualizar();

        ultimoMovimento = tempo;

        passou = 0;
    }


    let progresso =
        passou / velocidade;


    progresso =
        Math.min(
            progresso,
            1
        );


    desenhar(progresso);


    requestAnimationFrame(loop);
}


/* =========================
   GAME OVER
========================= */

function gameOver() {

    perdeu = true;

    document.getElementById(
        "mensagem"
    ).textContent =
        "Você perdeu! Aperte ENTER para tentar novamente.";
}


/* =========================
   REINICIAR
========================= */

function reiniciar() {

    cobra = [
        {x: 600, y: 360}
    ];

    cobraAnterior = [
        {x: 600, y: 360}
    ];

    direcao = "direita";

    comida = criarComida();

    pontos = 0;

    perdeu = false;

    ultimoMovimento =
        performance.now();


    document.getElementById(
        "pontos"
    ).textContent = 0;


    document.getElementById(
        "mensagem"
    ).textContent = "";
}


/* =========================
   CONTROLES
========================= */

document.addEventListener(
    "keydown",
    function(evento) {

        if (
            evento.key === "ArrowUp" &&
            direcao !== "baixo"
        ) {
            direcao = "cima";
        }


        if (
            evento.key === "ArrowDown" &&
            direcao !== "cima"
        ) {
            direcao = "baixo";
        }


        if (
            evento.key === "ArrowLeft" &&
            direcao !== "direita"
        ) {
            direcao = "esquerda";
        }


        if (
            evento.key === "ArrowRight" &&
            direcao !== "esquerda"
        ) {
            direcao = "direita";
        }


        if (
            evento.key === "Enter" &&
            perdeu
        ) {
            reiniciar();
        }

    }
);


/* INICIAR */

requestAnimationFrame(loop);

</script>

</body>

</html>
