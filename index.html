<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no"
    >

    <title>Jogo da Cobrinha</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow-x: hidden;
        }

        /* TELA DE ESCOLHA */

        #telaEscolha {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #telaEscolha h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        #telaEscolha p {
            font-size: 20px;
            color: #bbb;
            margin-bottom: 35px;
        }

        .opcoes {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .botaoModo {
            width: 220px;
            height: 150px;
            border: 2px solid #333;
            border-radius: 18px;
            background: #1c1c1c;
            color: white;
            font-size: 24px;
            cursor: pointer;
            transition: 0.2s;
        }

        .botaoModo:hover {
            transform: scale(1.05);
            background: #292929;
            border-color: #00dc50;
        }

        .icone {
            display: block;
            font-size: 55px;
            margin-bottom: 10px;
        }

        /* JOGO */

        #jogoContainer {
            display: none;
            padding: 10px;
        }

        h1 {
            margin-top: 10px;
            margin-bottom: 5px;
        }

        #info {
            font-size: 20px;
            margin: 8px;
        }

        #canvasContainer {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        canvas {
            background: #181818;
            border: 3px solid white;
            max-width: 95%;
            height: auto;
            touch-action: none;
        }

        #mensagem {
            font-size: 28px;
            margin-top: 15px;
        }

        /* BOTÕES */

        button {
            font-family: Arial;
            border: none;
        }

        #reiniciar {
            display: none;
            margin: 15px auto;
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            background: #00b947;
            color: white;
        }

        #trocarModo {
            margin: 10px;
            padding: 9px 18px;
            border-radius: 8px;
            cursor: pointer;
            background: #333;
            color: white;
        }

        /* CONTROLES MOBILE */

        #controlesMobile {
            display: none;
            margin: 15px auto;
            width: 230px;
        }

        .linhaControle {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 8px;
        }

        .controle {
            width: 68px;
            height: 68px;
            border-radius: 15px;
            background: #2b2b2b;
            color: white;
            font-size: 30px;
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
        }

        .controle:active {
            background: #00a83e;
            transform: scale(0.93);
        }

        /* CELULAR */

        @media (max-width: 700px) {

            #telaEscolha h1 {
                font-size: 32px;
            }

            .botaoModo {
                width: 160px;
                height: 120px;
                font-size: 19px;
            }

            .icone {
                font-size: 42px;
            }

            #tituloJogo {
                font-size: 25px;
            }

            #mensagem {
                font-size: 20px;
            }

        }

    </style>
</head>

<body>

<!-- TELA DE ESCOLHA -->

<div id="telaEscolha">

    <h1>
        🐍 Jogo da Cobrinha
    </h1>

    <p>
        Como você vai jogar?
    </p>

    <div class="opcoes">

        <button
            class="botaoModo"
            onclick="escolherModo('computador')"
        >

            <span class="icone">
                💻
            </span>

            Computador

        </button>

        <button
            class="botaoModo"
            onclick="escolherModo('celular')"
        >

            <span class="icone">
                📱
            </span>

            Celular

        </button>

    </div>

</div>


<!-- JOGO -->

<div id="jogoContainer">

    <h1 id="tituloJogo">
        🐍 Jogo da Cobrinha
    </h1>

    <div id="info">

        Pontos:

        <span id="pontos">
            0
        </span>

    </div>

    <div id="canvasContainer">

        <canvas
            id="jogo"
            width="1280"
            height="720"
        ></canvas>

    </div>

    <div id="mensagem"></div>

    <button id="reiniciar">
        Tentar novamente
    </button>


    <!-- CONTROLES DO CELULAR -->

    <div id="controlesMobile">

        <div class="linhaControle">

            <button
                class="controle"
                id="cima"
            >
                ▲
            </button>

        </div>

        <div class="linhaControle">

            <button
                class="controle"
                id="esquerda"
            >
                ◀
            </button>

            <button
                class="controle"
                id="baixo"
            >
                ▼
            </button>

            <button
                class="controle"
                id="direita"
            >
                ▶
            </button>

        </div>

    </div>

    <button id="trocarModo">
        Voltar
    </button>

</div>


<script>

const canvas =
    document.getElementById("jogo");

const ctx =
    canvas.getContext("2d");

const pontosTexto =
    document.getElementById("pontos");

const mensagem =
    document.getElementById("mensagem");

const botaoReiniciar =
    document.getElementById("reiniciar");

const controlesMobile =
    document.getElementById("controlesMobile");

const telaEscolha =
    document.getElementById("telaEscolha");

const jogoContainer =
    document.getElementById("jogoContainer");


/* CONFIGURAÇÕES */

const tamanho = 40;

/* VELOCIDADE DA COBRA */
const TEMPO_MOVIMENTO = 170;

/* FPS */
const FPS = 30;

const TEMPO_FRAME =
    1000 / FPS;


/* VARIÁVEIS */

let cobra;

let cobraAnterior;

let direcao;

let proximaDirecao;

let comida;

let pontos;

let gameOver;

let modo = "";

let ultimoMovimento;

let ultimoFrame = 0;


/* ESCOLHER MODO */

function escolherModo(dispositivo) {

    modo = dispositivo;

    telaEscolha.style.display =
        "none";

    jogoContainer.style.display =
        "block";

    if (modo === "celular") {

        controlesMobile.style.display =
            "block";

    } else {

        controlesMobile.style.display =
            "none";

    }

    iniciarJogo();

}


/* INICIAR JOGO */

function iniciarJogo() {

    cobra = [
        {
            x: 600,
            y: 360
        }
    ];

    cobraAnterior = [
        {
            x: 600,
            y: 360
        }
    ];

    direcao = "direita";

    proximaDirecao = "direita";

    pontos = 0;

    gameOver = false;

    mensagem.textContent = "";

    botaoReiniciar.style.display =
        "none";

    pontosTexto.textContent =
        pontos;

    ultimoMovimento =
        performance.now();

    criarComida();

}


/* CRIAR COMIDA */

function criarComida() {

    let x;
    let y;

    do {

        x =
            Math.floor(
                Math.random() *
                (canvas.width / tamanho)
            ) * tamanho;

        y =
            Math.floor(
                Math.random() *
                (canvas.height / tamanho)
            ) * tamanho;

    } while (

        cobra.some(
            parte =>
                parte.x === x &&
                parte.y === y
        )

    );

    comida = {
        x,
        y
    };

}


/* ATUALIZAR JOGO */

function atualizar() {

    if (gameOver) {
        return;
    }

    direcao =
        proximaDirecao;

    cobraAnterior =
        cobra.map(
            parte => ({
                x: parte.x,
                y: parte.y
            })
        );

    const cabeca = {
        ...cobra[
            cobra.length - 1
        ]
    };


    if (
        direcao === "direita"
    ) {

        cabeca.x +=
            tamanho;

    }


    if (
        direcao === "esquerda"
    ) {

        cabeca.x -=
            tamanho;

    }


    if (
        direcao === "cima"
    ) {

        cabeca.y -=
            tamanho;

    }


    if (
        direcao === "baixo"
    ) {

        cabeca.y +=
            tamanho;

    }


    /* PAREDE */

    if (
        cabeca.x < 0 ||
        cabeca.x >= canvas.width ||
        cabeca.y < 0 ||
        cabeca.y >= canvas.height
    ) {

        perder();

        return;
    }


    /* CORPO */

    if (
        cobra.some(
            parte =>
                parte.x === cabeca.x &&
                parte.y === cabeca.y
        )
    ) {

        perder();

        return;
    }


    cobra.push(
        cabeca
    );


    /* COMIDA */

    if (
        cabeca.x === comida.x &&
        cabeca.y === comida.y
    ) {

        pontos++;

        pontosTexto.textContent =
            pontos;

        criarComida();

    } else {

        cobra.shift();

    }


    while (
        cobraAnterior.length <
        cobra.length
    ) {

        cobraAnterior.unshift({
            ...cobraAnterior[0]
        });

    }

}


/* INTERPOLAÇÃO */

function interpolar(
    inicio,
    fim,
    progresso
) {

    return inicio +
        (fim - inicio) *
        progresso;

}


/* DESENHAR */

function desenhar(
    progresso
) {

    ctx.fillStyle =
        "#181818";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /* COMIDA */

    ctx.fillStyle =
        "#e63c3c";

    ctx.beginPath();

    ctx.arc(
        comida.x + tamanho / 2,
        comida.y + tamanho / 2,
        16,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* COBRA */

    cobra.forEach(
        (parte, index) => {

            const anterior =
                cobraAnterior[index]
                || parte;

            const x =
                interpolar(
                    anterior.x,
                    parte.x,
                    progresso
                );

            const y =
                interpolar(
                    anterior.y,
                    parte.y,
                    progresso
                );

            const cabeca =
                index ===
                cobra.length - 1;


            if (cabeca) {

                ctx.fillStyle =
                    "#00dc50";

            } else {

                ctx.fillStyle =
                    "#00963c";

            }


            ctx.fillRect(
                x + 2,
                y + 2,
                tamanho - 4,
                tamanho - 4
            );


            if (cabeca) {

                desenharRosto(
                    x,
                    y
                );

            }

        }
    );

}


/* ROSTO */

function desenharRosto(
    x,
    y
) {

    let olho1;
    let olho2;


    if (
        direcao ===
        "direita"
    ) {

        olho1 = {
            x: x + 29,
            y: y + 11
        };

        olho2 = {
            x: x + 29,
            y: y + 29
        };

    }

    else if (
        direcao ===
        "esquerda"
    ) {

        olho1 = {
            x: x + 11,
            y: y + 11
        };

        olho2 = {
            x: x + 11,
            y: y + 29
        };

    }

    else if (
        direcao ===
        "cima"
    ) {

        olho1 = {
            x: x + 11,
            y: y + 11
        };

        olho2 = {
            x: x + 29,
            y: y + 11
        };

    }

    else {

        olho1 = {
            x: x + 11,
            y: y + 29
        };

        olho2 = {
            x: x + 29,
            y: y + 29
        };

    }


    /* PARTE BRANCA */

    ctx.fillStyle =
        "white";

    ctx.beginPath();

    ctx.arc(
        olho1.x,
        olho1.y,
        7,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        olho2.x,
        olho2.y,
        7,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /* PUPILAS */

    ctx.fillStyle =
        "black";

    ctx.beginPath();

    ctx.arc(
        olho1.x,
        olho1.y,
        4,
        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        olho2.x,
        olho2.y,
        4,
        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* LOOP DO JOGO */

function loop(
    tempo
) {

    requestAnimationFrame(
        loop
    );


    if (
        tempo - ultimoFrame <
        TEMPO_FRAME
    ) {

        return;

    }


    ultimoFrame =
        tempo -
        (
            (tempo - ultimoFrame)
            %
            TEMPO_FRAME
        );


    if (
        modo === ""
    ) {

        return;

    }


    let tempoPassado =
        tempo -
        ultimoMovimento;


    if (
        tempoPassado >=
        TEMPO_MOVIMENTO
    ) {

        atualizar();

        ultimoMovimento =
            tempo;

        tempoPassado =
            0;

    }


    let progresso =
        tempoPassado /
        TEMPO_MOVIMENTO;


    progresso =
        Math.min(
            progresso,
            1
        );


    desenhar(
        progresso
    );

}


/* PERDER */

function perder() {

    gameOver =
        true;

    mensagem.textContent =
        "Você perdeu! Tente novamente.";

    botaoReiniciar.style.display =
        "inline-block";

}


/* MUDAR DIREÇÃO */

function mudarDirecao(
    nova
) {

    if (
        nova === "esquerda" &&
        direcao !== "direita"
    ) {

        proximaDirecao =
            "esquerda";

    }


    if (
        nova === "direita" &&
        direcao !== "esquerda"
    ) {

        proximaDirecao =
            "direita";

    }


    if (
        nova === "cima" &&
        direcao !== "baixo"
    ) {

        proximaDirecao =
            "cima";

    }


    if (
        nova === "baixo" &&
        direcao !== "cima"
    ) {

        proximaDirecao =
            "baixo";

    }

}


/* TECLADO */

document.addEventListener(
    "keydown",
    function(evento) {

        if (
            modo !==
            "computador"
        ) {

            return;

        }


        if (
            evento.key ===
            "ArrowLeft"
        ) {

            mudarDirecao(
                "esquerda"
            );

        }


        if (
            evento.key ===
            "ArrowRight"
        ) {

            mudarDirecao(
                "direita"
            );

        }


        if (
            evento.key ===
            "ArrowUp"
        ) {

            mudarDirecao(
                "cima"
            );

        }


        if (
            evento.key ===
            "ArrowDown"
        ) {

            mudarDirecao(
                "baixo"
            );

        }

    }
);


/* BOTÕES DO CELULAR */

document
    .getElementById("cima")
    .addEventListener(
        "pointerdown",
        function() {

            mudarDirecao(
                "cima"
            );

        }
    );


document
    .getElementById("baixo")
    .addEventListener(
        "pointerdown",
        function() {

            mudarDirecao(
                "baixo"
            );

        }
    );


document
    .getElementById("esquerda")
    .addEventListener(
        "pointerdown",
        function() {

            mudarDirecao(
                "esquerda"
            );

        }
    );


document
    .getElementById("direita")
    .addEventListener(
        "pointerdown",
        function() {

            mudarDirecao(
                "direita"
            );

        }
    );


/* REINICIAR */

botaoReiniciar.addEventListener(
    "click",
    iniciarJogo
);


/* VOLTAR */

document
    .getElementById("trocarModo")
    .addEventListener(
        "click",
        function() {

            modo = "";

            jogoContainer.style.display =
                "none";

            telaEscolha.style.display =
                "flex";

        }
    );


/* COMEÇAR LOOP */

requestAnimationFrame(
    loop
);

</script>

</body>
</html>
